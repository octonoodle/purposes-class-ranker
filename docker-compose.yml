services:
  db:
    image: postgres:15-alpine
    container_name: classranker-db
    environment:
      POSTGRES_DB: classranker
      POSTGRES_USER: classranker
      POSTGRES_PASSWORD: classranker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classranker -d classranker"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
